<div class="device__wrapper">
  <h2 class="device__title">{{device.name}}</h2>
  <table>
    <tr>
      <td>Testing type</td>
      <td>{{device.supportedQualityTesting}}</td>
    </tr>
    <tr>
      <td>Purchase Date</td>
      <td>{{formatedDate}}</td>
    </tr>
    <tr>
      <td>Serial</td>
      <td>{{device.serial}}</td>
    </tr>
  </table>
</div>
